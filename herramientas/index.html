<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herramientas | Fiscontable</title>
    <link rel="stylesheet" href="/assets/css/common.css?v=202611051700">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col">

<div id="app-header" data-modulo="herramientas" data-titulo="Herramientas"></div>

<main class="flex-grow w-full" style="max-width:1180px;margin:0 auto;padding:0 20px">

    <section style="padding:36px 0 18px">
        <h1 class="display" style="font-size:clamp(28px,4vw,38px)">Herramientas</h1>
    </section>

    <input type="search" id="buscar-herramienta" class="buscador" placeholder="Buscar herramienta… (o Ctrl+K desde cualquier pantalla)" autocomplete="off">
    <div id="plan-resumen" class="plan-resumen" hidden></div>
    <div id="herramientas-lista"></div>
    <p id="sin-resultados" class="grupo" hidden>Ninguna herramienta coincide con la búsqueda.</p>
    <div id="proximos" hidden>
        <h2 class="grupo">Próximos desarrollos</h2>
        <div class="rejilla" id="proximos-lista"></div>
    </div>
    <div style="height:64px"></div>
</main>

<footer class="fc-pie">© 2026 Alan Sánchez</footer>

<style>
    .grupo { font-size: 15px; font-weight: 600; color: var(--texto-tenue); margin: 30px 0 14px; }
    .rejilla { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }

    .util {
        position: relative;
        display: block;
        background: #fff;
        border: 1px solid var(--linea);
        border-radius: 16px;
        padding: 22px;
        text-decoration: none;
        color: inherit;
        box-shadow: var(--sombra-baja);
        transition: border-color .18s, box-shadow .18s;
    }
    .util:hover { border-color: var(--tono); box-shadow: var(--sombra-media); }
    .util__icono {
        width: 42px; height: 42px; border-radius: 12px;
        background: var(--tono-suave); color: var(--tono);
        display: grid; place-items: center; margin-bottom: 16px;
    }
    .util__icono svg { width: 21px; height: 21px; }
    .util h3 { font-size: 16.5px; font-weight: 700; margin-bottom: 6px; line-height: 1.3; }
    .util p { font-size: 13.5px; line-height: 1.55; color: var(--texto-tenue); }
    .util__cta { display: inline-block; margin-top: 14px; font-size: 13.5px; font-weight: 700; color: var(--tono); }
    .util__cinta { position: absolute; top: 16px; right: 16px; }

    .util--futuro {
        background: transparent;
        border-style: dashed;
        box-shadow: none;
        opacity: .72;
    }
    .util--futuro h3 { color: var(--texto-tenue); }

    .util--vedado { background: #fafafa; box-shadow: none; }
    .util--vedado .util__icono { filter: grayscale(1); opacity: .6; }
    .util--vedado h3, .util--vedado p { color: #94a3b8; }
    .util--vedado .util__cta { color: #92400e; }
    .util--vedado:hover { border-color: #f59e0b; }
    .util__cinta--plan { font-size: 11.5px; font-weight: 700; color: #92400e; background: #fffbeb; border: 1px solid #fde68a; border-radius: 999px; padding: 2px 9px; }
    .util__etiqueta { display: inline-block; margin-bottom: 8px; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--acento, #4f46e5); }
    .plan-resumen { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 16px; background: #fff; border: 1px solid var(--linea); border-radius: 14px; padding: 12px 16px; font-size: 14px; color: #334155; box-shadow: var(--sombra-baja); }
    .plan-resumen b { color: #0f172a; }
    .plan-resumen button { margin-left: auto; font: inherit; font-size: 13px; font-weight: 700; color: #92400e; background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 7px 12px; cursor: pointer; }
    .buscador { width: min(520px, 100%); margin-top: 4px; padding: 11px 14px; border: 1px solid var(--linea); border-radius: 12px; font: inherit; font-size: 14.5px; background: #fff; box-shadow: var(--sombra-baja); }
    .buscador:focus { outline: none; border-color: var(--acento); box-shadow: 0 0 0 3px var(--acento-suave); }
</style>

<script src="/assets/js/nucleo.js?v=202611051700"></script>
<script src="/assets/js/barra.js?v=202611051700"></script>
<script>
    (function () {
        // Las tarjetas salen del mismo catálogo que el menú «Módulos» y la portada (barra.js)
        var esc = Fiscontable.escapar;
        function svg(d) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="' + d + '"/></svg>'; }
        function sinAcentos(t) { return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
        var motivo = null;
        function pintar() {
            var q = sinAcentos(document.getElementById("buscar-herramienta").value.trim());
            var cat = (Fiscontable.catalogo || []).filter(function (m) { return m.grupo !== "Mi despacho" && m.clave !== "creditos"; });
            var grupos = [], html = "", n = 0;
            cat.forEach(function (m) { if (grupos.indexOf(m.grupo) === -1) grupos.push(m.grupo); });
            grupos.forEach(function (g) {
                var items = cat.filter(function (m) { return m.grupo === g && (!q || sinAcentos(m.nombre + " " + m.desc + " " + g).indexOf(q) !== -1); });
                if (!items.length) return;
                n += items.length;
                html += '<h2 class="grupo">' + esc(g) + '</h2><div class="rejilla">' + items.map(function (m) {
                    var ok = !motivo && Fiscontable.permitido(m);
                    var porPlan = !ok && !motivo;          // sin conexión o acceso vencido no es cosa del plan
                    return '<a href="' + esc(m.url) + '" class="util' + (ok ? "" : " util--vedado") + '" style="--tono:' + m.tono + ";--tono-suave:" + m.suave + '"' +
                        (ok ? "" : porPlan ? ' data-plan="' + esc(m.clave) + '"' : ' aria-disabled="true" onclick="return false" title="' + esc(motivo) + '"') + ">" +
                        (porPlan ? '<span class="util__cinta util__cinta--plan">🔒 No incluido en tu plan</span>' : "") +
                        '<span class="util__icono">' + svg(m.icono) + "</span><h3>" + esc(m.nombre) + "</h3><p>" + esc(m.desc) + '.</p><span class="util__cta">' +
                        (ok ? "Abrir" : porPlan ? "Mejorar mi plan →" : "No disponible") + "</span></a>";
                }).join("") + "</div>";
            });
            document.getElementById("herramientas-lista").innerHTML = html;
            document.getElementById("sin-resultados").hidden = n > 0;
            // Resumen del plan (solo si hay algo bloqueado) y próximos desarrollos
            var p = perfil, bloqueados = p && !motivo ? cat.filter(function (m) { return !Fiscontable.permitido(m); }).length : 0;
            var caja = document.getElementById("plan-resumen");
            caja.hidden = !bloqueados || !!q;
            if (bloqueados) caja.innerHTML = "<span>Tu plan: <b>" + esc(Fiscontable.nombrePlan() || "actual") + "</b> · incluye " + (cat.length - bloqueados) + " de " + cat.length +
                " herramientas.</span><button type=\"button\" id=\"btn-mejorar\">Mejorar mi plan</button>";
            var prox = (p && p.planes && p.planes.proximos) || [];
            document.getElementById("proximos").hidden = !prox.length || !!q;
            document.getElementById("proximos-lista").innerHTML = prox.map(function (x) {
                return '<div class="util util--futuro">' + (x.etiqueta ? '<span class="util__etiqueta">' + esc(x.etiqueta) + "</span>" : "") +
                    "<h3>" + esc(x.titulo) + "</h3>" + (x.desc ? "<p>" + esc(x.desc) + "</p>" : "") + "</div>";
            }).join("");
        }
        var perfil = null;
        document.getElementById("plan-resumen").addEventListener("click", function (e) {
            if (!e.target.closest("#btn-mejorar")) return;
            var primero = document.querySelector("#herramientas-lista [data-plan]");
            Fiscontable.avisoPlan(primero ? primero.dataset.plan : null);
        });
        document.getElementById("buscar-herramienta").addEventListener("input", pintar);
        document.getElementById("buscar-herramienta").addEventListener("keydown", function (e) {
            if (e.key !== "Enter") return;
            var a = document.querySelector("#herramientas-lista .util:not(.util--vedado)");
            if (a) location.href = a.getAttribute("href");
        });
        document.addEventListener("fc:perfil", function (e) {
            var p = e.detail;
            perfil = p;
            motivo = !p ? "No disponible sin conexión al servidor" : p.solo_lectura ? "Tu acceso venció." : null;
            pintar();
        });
        pintar();
    })();
</script>
</body>
</html>

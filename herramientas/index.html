<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herramientas | Fiscontable</title>
    <link rel="stylesheet" href="/assets/css/common.css?v=202611231700">
    <link rel="stylesheet" href="/assets/css/tailwind.css?v=202611231700">
</head>
<body class="min-h-screen flex flex-col">

<div id="app-header" data-carriles="1" data-modulo="herramientas" data-titulo="Herramientas"></div>
<script src="/assets/js/nucleo.js?v=202611231700"></script>
<script src="/assets/js/barra.js?v=202611231700"></script>

<main class="flex-grow w-full" style="max-width:1180px;margin:0 auto;padding:0 20px">

    <section style="padding:36px 0 18px">
        <h1 class="display" style="font-size:clamp(28px,4vw,38px)">Herramientas</h1>
    </section>

    <input type="search" id="buscar-herramienta" class="buscador" placeholder="Buscar herramienta… (o Ctrl+K desde cualquier pantalla)" autocomplete="off">
    <div id="plan-resumen" class="plan-resumen" hidden></div>
    <div id="herramientas-lista"></div>
    <p id="sin-resultados" class="grupo" hidden>Ninguna herramienta coincide con la búsqueda.</p>
    <div id="proximos" hidden>
        <h2 class="grupo">Próximos desarrollos</h2>
        <div class="rejilla" id="proximos-lista"></div>
    </div>
    <div style="height:64px"></div>
</main>

<style>
    .grupo { font-size: 15px; font-weight: 600; color: var(--texto-tenue); margin: 30px 0 14px; }
    .rejilla { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }

    .util {
        position: relative;
        display: block;
        background: rgb(var(--g-0));
        border: 1px solid var(--linea);
        border-radius: 16px;
        padding: 22px;
        text-decoration: none;
        color: inherit;
        box-shadow: var(--sombra-baja);
        transition: border-color .18s, box-shadow .18s;
    }
    .util:hover { border-color: var(--tono); box-shadow: var(--sombra-media); }
    .util__icono {
        width: 42px; height: 42px; border-radius: 12px;
        background: var(--tono-suave); color: var(--tono);
        display: grid; place-items: center; margin-bottom: 16px;
    }
    .util__icono svg { width: 21px; height: 21px; }
    .util h3 { font-size: 16.5px; font-weight: 700; margin-bottom: 6px; line-height: 1.3; }
    .util p { font-size: 13.5px; line-height: 1.55; color: var(--texto-tenue); }
    .util__cta { display: inline-block; margin-top: 14px; font-size: 13.5px; font-weight: 700; color: var(--tono); }
    .util__cinta { position: absolute; top: 16px; right: 16px; }

    .util--futuro {
        background: transparent;
        border-style: dashed;
        box-shadow: none;
        opacity: .72;
    }
    .util--futuro h3 { color: var(--texto-tenue); }

    .util--vedado { background: rgb(var(--g-50)); box-shadow: none; }
    .util--vedado .util__icono { filter: grayscale(1); opacity: .6; }
    .util--vedado h3, .util--vedado p { color: rgb(var(--g-500)); }
    .util--vedado .util__cta { color: rgb(var(--av-600)); }
    .util--vedado:hover { border-color: rgb(var(--av-600)); }
    .util__cinta--plan { font-size: 11.5px; font-weight: 700; color: rgb(var(--av-600)); background: rgb(var(--av-50)); border: 1px solid rgb(var(--av-200)); border-radius: 999px; padding: 2px 9px; }
    .util__etiqueta { display: inline-block; margin-bottom: 8px; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--acento, rgb(var(--ac-600))); }
    .plan-resumen { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 16px; background: rgb(var(--g-0)); border: 1px solid var(--linea); border-radius: 14px; padding: 12px 16px; font-size: 14px; color: rgb(var(--g-700)); box-shadow: var(--sombra-baja); }
    .plan-resumen b { color: rgb(var(--g-900)); }
    .plan-resumen button { margin-left: auto; font: inherit; font-size: 13px; font-weight: 700; color: rgb(var(--av-600)); background: rgb(var(--av-50)); border: 1px solid rgb(var(--av-200)); border-radius: 10px; padding: 7px 12px; cursor: pointer; }
    .buscador { width: min(520px, 100%); margin-top: 4px; padding: 11px 14px; border: 1px solid var(--linea); border-radius: 12px; font: inherit; font-size: 14.5px; background: rgb(var(--g-0)); box-shadow: var(--sombra-baja); }
    .buscador:focus { outline: none; border-color: var(--acento); box-shadow: 0 0 0 3px var(--acento-suave); }
</style>

<script src="/herramientas/tarjetas.js?v=202611231700"></script>
</body>
</html>

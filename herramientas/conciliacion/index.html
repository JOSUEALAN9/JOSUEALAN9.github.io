<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conciliación · Fiscontable</title>
    <link rel="stylesheet" href="/assets/css/common.css?v=202609291637">
    <link rel="stylesheet" href="/herramientas/xml/xml.css?v=202609291637">
    <link rel="stylesheet" href="/herramientas/conciliacion/conciliacion.css?v=202609291637">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
<div id="app-header" data-modulo="conciliacion" data-titulo="Conciliación" data-migas="Herramientas|/herramientas/"></div>
<script src="/assets/js/nucleo.js?v=202609291637"></script>
<script src="/assets/js/barra.js?v=202609291637"></script>

<main class="xml-pagina">
    <div class="xml-cabeza">
        <h1>Conciliación de facturas</h1>
        <div class="xml-cabeza__acciones">
            <a id="btn-ir-xml" class="xml-btn" href="/herramientas/xml/" hidden>Ver sus XML</a>
            <button type="button" id="btn-agregar" class="xml-btn xml-btn--primario">+ Agregar XML</button>
        </div>
    </div>

    <!-- Contexto: mismo patrón que Administración de XML -->
    <div class="ctx">
        <div class="xml-menu">
            <button type="button" id="btn-otra" class="ctx-campo" aria-haspopup="menu">
                <span class="ctx-campo__texto"><small id="empresa-etiqueta">Empresa</small><strong id="empresa-titulo">Elegir empresa</strong></span>
                <span class="ctx-campo__flecha" aria-hidden="true">▾</span>
            </button>
            <div id="menu-otra" class="xml-menu__lista xml-menu__lista--otra" hidden></div>
        </div>
        <button type="button" id="btn-periodo" class="ctx-campo" aria-haspopup="dialog" disabled>
            <span class="ctx-campo__texto"><small>Periodo</small><strong id="periodo-titulo">Elegir periodo</strong></span>
            <span class="ctx-campo__flecha" aria-hidden="true">▾</span>
        </button>
        <input type="hidden" id="sel-periodo">
        <div class="ctx-segmento" id="base" role="group" aria-label="Qué facturas entran al periodo">
            <button type="button" data-base="emision" aria-pressed="true">Lo facturado</button>
            <button type="button" data-base="pago" aria-pressed="false" id="base-pago">Lo cobrado</button>
        </div>
        <input type="hidden" id="sel-base" value="emision">
    </div>
    <p id="ayuda-base" class="ctx-ayuda" hidden></p>

    <section id="bandeja"></section>
    <div id="resultado-carga"></div>
    <div id="sin-empresa" class="ctx-vacio" hidden></div>

    <div id="contenido" hidden>
        <div id="aviso-otra" class="xml-aviso-otra" hidden></div>

        <div class="conc-controles">
            <div class="conc-lados" role="tablist" id="lados">
                <button type="button" class="conc-lado" data-lado="emitidos">Mis facturas emitidas <span>clientes · cobranza</span></button>
                <button type="button" class="conc-lado" data-lado="recibidos">Mis facturas recibidas <span>proveedores · pagos</span></button>
            </div>
        </div>

        <div id="aviso-validar" class="conc-aviso" hidden></div>
        <div id="tarjetas" class="ctx-resumen"></div>
        <div id="chips-estado" class="xml-chips"></div>

        <div class="xml-toolbar">
            <input type="search" id="buscar" placeholder="Buscar folio, RFC, nombre, UUID…">
            <div class="xml-toolbar__der">
                <div class="xml-menu">
                    <button type="button" id="btn-filtros" class="xml-btn">Filtros<span id="cuenta-filtros" class="xml-insignia" hidden></span></button>
                    <div id="menu-filtros" class="xml-menu__lista xml-menu__lista--filtros" hidden>
                        <p class="xml-filtro__titulo">Rápidos</p>
                        <div id="rapidos" class="xml-chips xml-chips--rapidos"></div>
                        <p class="xml-filtro__titulo">Más filtros</p>
                        <div id="avanzados" class="xml-avanzados"></div>
                        <button type="button" id="quitar-filtros" class="xml-enlace">Quitar todos los filtros</button>
                    </div>
                </div>
                <button type="button" id="btn-validar" class="xml-btn" title="Consulta en el SAT si facturas, pagos y notas están vigentes o cancelados">Validar ante el SAT</button>
                <button type="button" id="btn-tc" class="xml-btn">Tipos de cambio</button>
                <button type="button" id="btn-columnas" class="xml-btn">Columnas</button>
                <div class="xml-menu">
                    <button type="button" id="btn-vistas" class="xml-btn"><span id="nombre-vista">Vista de fábrica</span> ▾</button>
                    <div id="menu-vistas" class="xml-menu__lista" hidden></div>
                </div>
                <div class="xml-menu">
                    <button type="button" id="btn-excel" class="xml-btn xml-btn--verde">Excel ▾</button>
                    <div id="menu-excel" class="xml-menu__lista" hidden>
                        <button type="button" data-excel="vista">Esta tabla <span>con tus columnas y filtros, más movimientos y tipos de cambio</span></button>
                        <button type="button" data-excel="completo">Todo el periodo <span>todas las facturas, sin filtros</span></button>
                    </div>
                </div>
            </div>
        </div>

        <div id="avance-validacion" class="xml-validando" hidden>
            <div class="xml-validando__texto"><strong id="validando-titulo">Validando ante el SAT…</strong> <span id="validando-detalle"></span></div>
            <div class="xml-barra"><span id="validando-barra"></span></div>
            <button type="button" id="btn-detener" class="xml-enlace">Detener</button>
        </div>

        <div id="barra-seleccion" class="xml-seleccion" hidden>
            <span id="texto-seleccion"></span>
            <button type="button" id="btn-validar-sel" class="xml-btn">Validar ante el SAT</button>
            <button type="button" id="btn-limpiar-sel" class="xml-enlace">Quitar selección</button>
        </div>

        <div id="tablas"></div>
        <p class="xml-pie"><span id="conteo-filas"></span> · Clic en una factura para ver sus pagos y notas · Arrastra los encabezados para reordenar y su borde para cambiar el ancho · Lo cancelado en el SAT no cuenta.</p>
    </div>
</main>

<!-- Detalle de una factura -->
<aside id="panel-factura" class="xml-panel conc-panel" hidden aria-label="Detalle de la factura"></aside>
<!-- Tipos de cambio -->
<aside id="panel-tc" class="xml-panel conc-panel conc-panel--ancho" hidden aria-label="Tipos de cambio"></aside>

<!-- Ventana para preguntas (validar, ajuste manual) -->
<div id="modal" class="xml-modal" hidden>
    <div class="xml-modal__caja" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
        <h3 id="modal-titulo"></h3>
        <div id="modal-cuerpo"></div>
        <div class="xml-modal__acciones" id="modal-acciones"></div>
    </div>
</div>

<script src="/assets/js/comun/tabla.js?v=202609291637"></script>
<script src="/assets/js/comun/bandeja-xml.js?v=202609291637"></script>
<script src="/herramientas/conciliacion/conciliacion.js?v=202609291637"></script>
</body>
</html>

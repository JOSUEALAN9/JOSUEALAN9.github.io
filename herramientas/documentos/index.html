<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentos | Fiscontable</title>
    <link rel="stylesheet" href="/assets/css/tailwind.css?v=202611122100">
    <link rel="stylesheet" href="/assets/css/common.css?v=202611122100">
    <link rel="stylesheet" href="/herramientas/xml/xml.css?v=202611122100">
    <link rel="stylesheet" href="/herramientas/documentos/documentos.css?v=202611122100">
</head>
<body class="min-h-screen flex flex-col">

<div id="app-header" data-modulo="documentos" data-titulo="Documentos" data-migas="Herramientas|/herramientas/"></div>
<script src="/assets/js/nucleo.js?v=202611122100"></script>
<script src="/assets/js/barra.js?v=202611122100"></script>

<main class="flex-grow w-full mod-pagina" style="max-width:1120px">
    <div class="mod-cabeza">
        <div class="fc-titulo">
            <h1>Documentos</h1>
            <div class="fc-vista" role="tablist" aria-label="Vista">
                <button type="button" role="tab" data-vista="pedir" aria-selected="true">Solicitar documento</button>
                <button type="button" role="tab" data-vista="estatus" aria-selected="false">Mis solicitudes <span class="dc-insignia" id="n-en-curso" hidden></span></button>
            </div>
        </div>
        <a class="dc-saldo" id="dc-saldo" href="/creditos/" hidden></a>
    </div>

    <div id="aviso" class="dc-aviso" role="status" hidden></div>

    <section class="dc-caja" id="vista-pedir">
        <h2>Solicitar un documento</h2>
        <div class="dc-categorias" id="categorias" role="tablist" aria-label="Tipo de documento"></div>
        <div class="dc-servicios" id="servicios" role="radiogroup" aria-label="Documento"></div>

        <form id="form" class="dc-form" autocomplete="off" hidden>
            <h3 id="f-titulo"></h3>
            <div class="dc-rejilla" id="f-campos"></div>
            <label class="dc-campo dc-campo--nota">Referencia (opcional)
                <input id="f-nota" maxlength="80" placeholder="Ej. nombre del cliente o del trámite">
            </label>
            <p id="f-error" class="dc-error" hidden></p>
            <div class="dc-pie">
                <p class="dc-nota" id="f-costo"></p>
                <button type="submit" class="boton-principal" id="f-enviar">Solicitar</button>
            </div>
        </form>
    </section>

    <section class="dc-caja" id="vista-estatus" hidden>
        <p class="dc-nota dc-actualizado" id="actualizado"></p>
        <!-- Tabla estándar (FCTabla.estandar); el detalle de cada solicitud abre en el panel lateral -->
        <div id="tabla-doc"></div>
    </section>
</main>

<script src="/assets/js/comun/tabla.js?v=202611122100"></script>
<script src="/herramientas/documentos/documentos.js?v=202611122100"></script>
</body>
</html>

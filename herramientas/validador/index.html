<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador | Fiscontable</title>
    <link rel="stylesheet" href="/assets/css/common.css?v=202611120800">
    <link rel="stylesheet" href="/herramientas/xml/xml.css?v=202611120800">
    <link rel="stylesheet" href="/assets/css/tailwind.css?v=202611120800">
    <style>
        .val-cabeza-seg { margin-left: auto; }
        .val-avance { margin-bottom: 10px; }
        .val-cambio { color: rgb(var(--av-700)); font-weight: 600; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden relative">

    <!-- TOP NAV -->
    <div id="app-header" data-modulo="validador" data-titulo="Validador" data-migas="Herramientas|/herramientas/"></div>
<script src="/assets/js/nucleo.js?v=202611120800"></script>
<script src="/assets/js/barra.js?v=202611120800"></script>

    <!-- ÁREA DE TRABAJO -->
    <main class="flex-grow flex flex-col mod-pagina overflow-hidden relative" style="min-height:0">
    <div class="mod-cabeza"><h1>Validador</h1><span id="origenTexto" class="xml-tenue" style="font-size:13px;margin-right:auto"></span>
        <div class="ctx-segmento val-cabeza-seg" id="seg-rol" role="group" aria-label="Qué XML de la empresa">
            <button type="button" data-rol="recibido" aria-pressed="true">Recibidos</button>
            <button type="button" data-rol="emitido" aria-pressed="false">Emitidos</button>
        </div>
    </div>
    <div class="mod-layout" style="flex:1;min-height:0">
    <aside class="mod-acciones" aria-label="Acciones">
        <p class="mod-acciones__grupo">Validar</p>
        <button type="button" id="btnValidar" class="mod-accion mod-accion--primaria" title="Consulta en el SAT el estado de los XML de la tabla"><b>✓</b>Validar en el SAT</button>
        <button type="button" id="btnReintentar" class="mod-accion" hidden><b>↻</b>Reintentar sin respuesta</button>
        <p class="mod-acciones__grupo">Otros XML</p>
        <button type="button" id="btnAbrirCarga" class="mod-accion" title="Se consultan en el SAT y no se guardan"><b>+</b>Cargar XML externos</button>
        <button type="button" id="btnVolverEmpresa" class="mod-accion" hidden><b>←</b>Volver a la empresa</button>
    </aside>
    <div class="mod-layout__principal" style="display:flex;flex-direction:column;min-height:0;height:100%">
        <div id="linea-programa"></div>
        <div id="avance" class="xml-validando val-avance" hidden>
            <div class="xml-validando__texto"><strong>Validando ante el SAT…</strong> <span id="avance-texto"></span></div>
            <div class="xml-barra"><span id="avance-barra"></span></div>
            <button type="button" id="btnDetener" class="xml-enlace">Detener</button>
        </div>
        <div id="tabla-val" style="flex:1;min-height:0"></div>
    </div>
    </div>
    </main>
    <!-- Cargar XML externos (no se guardan) -->
    <dialog id="modalCarga" class="ui-modal" aria-labelledby="titulo-carga">
        <div class="ui-modal__cuerpo">
            <h3 id="titulo-carga">Cargar XML externos</h3>
            <p class="xml-tenue">Se consultan en el SAT y no se guardan en ninguna empresa.</p>
            <div id="zona-carga"></div>
            <button type="button" class="xml-enlace" style="align-self:flex-start" onclick="document.getElementById('folderInputArr').click()">o elige una carpeta completa</button>
            <input type="file" id="folderInputArr" webkitdirectory directory multiple accept=".xml" hidden>
            <p>XML listos: <b id="lblStagedCount">0</b></p>
        </div>
        <div class="ui-modal__pie">
            <button type="button" id="btnCerrarModal" class="ui-btn ui-btn--secundario ui-btn--32">Cancelar</button>
            <button type="button" id="btnProcesarStaged" class="ui-btn ui-btn--primario ui-btn--32" disabled>Validar con el SAT</button>
        </div>
    </dialog>
<script src="/assets/js/comun/tabla.js?v=202611120800"></script>
<script src="/assets/js/comun/zona-archivos.js?v=202611120800"></script>
<script src="/assets/js/comun/programacion.js?v=202611120800"></script>
<script src="/herramientas/validador/validador.js?v=202611120800"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Declaraciones | Fiscontable</title>
    <link rel="stylesheet" href="/assets/css/common.css?v=202611131420">
    <link rel="stylesheet" href="/assets/css/tailwind.css?v=202611131420">
</head>
<body class="min-h-screen flex flex-col">

<div id="app-header"
     data-modulo="declaraciones"
     data-titulo="Declaraciones"
     data-migas="Herramientas|/herramientas/"></div>

<main class="flex-grow w-full mod-pagina mod-pagina--angosta">

    <div class="mod-cabeza"><h1>Declaraciones</h1>
        <div class="mod-cabeza__acciones">
            <button type="button" class="fc-btn" data-programar title="Una sola vez, en horario nocturno, para los clientes que elijas">Programar una vez</button>
        </div>
    </div>

    <div id="alerta" class="fc-aviso" style="margin:0 0 16px" hidden></div>

    <div id="linea-programa"></div>
    <div id="programar-madrugada"></div>

    <div id="paso-cliente"></div>

    <!-- Paso 2: e.firma, sólo si no está guardada -->
    <section id="paso-efirma" class="ficha" hidden>
        <h2 class="ficha__titulo">Su e.firma</h2>
        <p class="ficha__nota">Viaja cifrada y se borra al terminar.</p>

        <div class="dos">
            <label class="campo" id="campo-cer">
                <span class="campo__etiqueta">Certificado (.cer)</span>
                <input type="file" id="cer" accept=".cer" class="campo__archivo">
            </label>
            <label class="campo">
                <span class="campo__etiqueta">Clave privada (.key)</span>
                <input type="file" id="key" accept=".key" class="campo__archivo">
            </label>
        </div>

        <label class="campo" style="margin-top:12px">
            <span class="campo__etiqueta">Contraseña de la e.firma</span>
            <span style="position:relative;display:block">
                <input type="password" id="password" autocomplete="new-password" class="campo__control" style="padding-right:44px">
                <button type="button" id="ver-password" class="ojo" aria-label="Mostrar contraseña">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.5 12C3.7 7.9 7.5 5 12 5s8.3 2.9 9.5 7c-1.2 4.1-5 7-9.5 7s-8.3-2.9-9.5-7z"/>
                    </svg>
                </button>
            </span>
        </label>
    </section>

    <!-- Paso 3: qué buscar -->
    <section id="paso-opciones" class="ficha" hidden>
        <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px">
            <h2 class="ficha__titulo" style="margin:0">Qué buscar</h2>
            <button type="button" id="btn-guardadas" class="fc-guardadas" hidden>
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
                Declaraciones guardadas <b id="n-guardadas">0</b></button>
        </div>

        <div class="dos">
            <label class="campo">
                <span class="campo__etiqueta">Tipo de persona</span>
                <select id="tipo-persona" class="campo__control">
                    <option value="pm">Moral</option>
                    <option value="pf">Física</option>
                </select>
            </label>
            <label class="campo">
                <span class="campo__etiqueta">Ejercicio</span>
                <select id="ejercicio" class="campo__control"></select>
            </label>
        </div>

        <fieldset style="margin-top:16px;border:0;padding:0">
            <legend class="campo__etiqueta" style="padding:0">Portales del SAT</legend>
            <div style="display:flex;gap:18px;margin-top:8px">
                <label class="marca"><input type="checkbox" id="portal-nuevo" checked> Nuevo</label>
                <label class="marca"><input type="checkbox" id="portal-antiguo" checked> Anterior</label>
            </div>
        </fieldset>

        <label class="marca" style="margin-top:14px"><input type="checkbox" id="forzar"> Volver a descargar todo</label>
        <p class="ficha__nota" style="margin-top:8px">Se descargan el acuse de detalle, el de pago y el de recibo.</p>

        <button type="button" id="btn-buscar" class="boton-principal">Buscar y descargar</button>

        <div id="resultado" hidden></div>
    </section>


</main>

<script src="/assets/js/nucleo.js?v=202611131420"></script>
<script src="/assets/js/barra.js?v=202611131420"></script>
<script src="/assets/js/comun/leer-cer.js?v=202611131420"></script>
<script src="/assets/js/comun/paso-cliente.js?v=202611131420"></script>
<script src="/assets/js/comun/documentos-guardados.js?v=202611131420"></script>
<script src="/herramientas/declaraciones/declaraciones.js?v=202611131420"></script>
<script src="/assets/js/comun/acciones.js?v=202611131420"></script>
<script src="/assets/js/comun/programar.js?v=202611131420"></script>
<script src="/assets/js/comun/programacion.js?v=202611131420"></script>
<script>FCProgramacion.linea({ modulo: "declaraciones", contenedor: document.getElementById("linea-programa") });</script>
<script>Fiscontable.Programar.montar({ modulo: "declaraciones", contenedor: "programar-madrugada" });</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nómina | Fiscontable</title>
    <link rel="stylesheet" href="/assets/css/common.css?v=202611120827">
    <link rel="stylesheet" href="/assets/css/tailwind.css?v=202611120827">
    <style>
        .nm { padding: var(--e-5) var(--e-5) var(--e-6); }
        .nm-cabeza { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--e-2) var(--e-4); margin-bottom: var(--e-3); }
        .nm-cabeza h1 { font-size: var(--t-24); font-weight: 700; margin: 0; color: rgb(var(--g-900)); }
        .nm-nota { font-size: var(--t-13); color: rgb(var(--g-600)); margin: 0; }
        .nm-marco { display: block; width: 100%; height: calc(100vh - var(--barra-alto) - 120px); min-height: 560px; border: 1px solid var(--linea);
                    border-radius: var(--r-tarjeta); background: rgb(var(--g-0)); }
        .nm-aviso { max-width: 560px; }
    </style>
</head>
<body>
<div id="app-header" data-modulo="nomina" data-titulo="Nómina"></div>
<script src="/assets/js/nucleo.js?v=202611120827"></script>
<script src="/assets/js/barra.js?v=202611120827"></script>

<main class="nm">
    <div class="nm-cabeza">
        <h1>Nómina</h1>
        <span class="ui-estado ui-estado--aviso">Laboratorio · solo administrador</span>
        <p class="nm-nota" id="nm-version"></p>
    </div>
    <p class="nm-nota" style="margin-bottom:var(--e-3)">Prueba del motor de cálculo. Todo se calcula en tu navegador: el acumulado, los XML y las constancias que cargues no se suben al servidor.</p>
    <div id="nm-aviso" class="ui-aviso nm-aviso" hidden></div>
    <!-- La página de prueba la entrega el servidor (repo privado) solo al administrador. Va aislada (sandbox sin
         mismo origen): no ve tu sesión, tus cookies ni la API de Fiscontable. -->
    <iframe id="nm-marco" class="nm-marco" title="Prueba del motor de nómina" hidden
            sandbox="allow-scripts allow-downloads allow-forms allow-modals allow-popups"></iframe>
</main>

<script>
(function () {
    "use strict";
    var $ = function (id) { return document.getElementById(id); };
    function avisar(t) { $("nm-aviso").textContent = t; $("nm-aviso").hidden = false; }
    async function iniciar() {
        var p = await Fiscontable.perfil();
        if (!p || p._error || p.rol !== "admin") { avisar("Esta página es solo para el administrador."); return; }
        try {
            var r = await fetch(Fiscontable.API + "/api/nomina/prueba", { credentials: "include" });
            if (!r.ok) throw new Error(await Fiscontable.leerError(r));
            // La página del motor pide tres librerías; aquí se le dan las copias de nuestro sitio (mismas versiones):
            // nada se carga de otros servidores (política de contenido, _headers).
            var pagina = (await r.text())
                .replace(/https:\/\/cdnjs\.cloudflare\.com\/ajax\/libs\/pdf\.js\/3\.11\.174\//g, "/assets/js/terceros/pdfjs/")
                .replace("https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js", "/assets/js/terceros/fflate.min.js")
                .replace(/<link[^>]+fonts\.(googleapis|gstatic)\.com[^>]*>\s*/g, "");
            $("nm-marco").srcdoc = pagina;
            $("nm-marco").hidden = false;
            var e = await fetch(Fiscontable.API + "/api/nomina/estado", { credentials: "include" });
            if (e.ok) { var d = await e.json(); $("nm-version").textContent = "Motor " + d.motor; }
        } catch (err) { avisar("No se pudo abrir la prueba del motor: " + err.message); }
    }
    iniciar();
})();
</script>
</body>
</html>
